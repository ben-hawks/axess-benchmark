# AXESS wa-hls4ml Benchmark -- Codabench competition bundle (results submission).
# Built by ../build_bundle.py, which adds the generated files (reference_data/,
# solution/, starting_kit/sample_submission.zip, starting_kit/*_sample_ids.csv).
# See ../README.md for how to build, validate and upload it.
version: 2
title: AXESS wa-hls4ml Benchmark
description: >-
  Predict the FPGA resources (LUT, FF, DSP, BRAM) and latency (cycles, initiation
  interval) that logic synthesis reports for an hls4ml-converted neural network, from
  the network and its hls4ml configuration alone.
image: logo.png
contact_email: bhawks@fnal.gov
registration_auto_approve: True
docker_image: codalab/codalab-legacy:py312

terms: pages/terms_and_conditions.md
pages:
  - title: Overview
    file: pages/overview.md
  - title: Data
    file: pages/data.md
  - title: Evaluation
    file: pages/evaluation.md

# Results submission: no ingestion program. Participants upload predictions for both
# the test and exemplar splits; reference_data/ holds the post-synthesis ground truth.
tasks:
  - index: 0
    name: Resource and latency estimation
    description: Score test-set and exemplar-set predictions against post-synthesis ground truth.
    reference_data: reference_data/
    scoring_program: scoring_program/

# The reference solution (the retrained Transformer's predictions) doubles as the
# example submission: starting_kit/sample_submission.zip is solution/ zipped.
solutions:
  - index: 0
    tasks:
      - 0
    path: solution/

phases:
  - index: 0
    name: Open Benchmark
    description: Open, ongoing benchmark. Each submission is scored on both the test set and the exemplar set.
    start: 10-02-2026
    max_submissions_per_day: 5
    execution_time_limit: 600
    tasks:
      - 0
    starting_kit: starting_kit

leaderboards:
  - title: Results
    key: main
    submission_rule: "Add_And_Delete_Multiple"
    columns:
      - title: Test mean R2
        key: test_mean_r2
        index: 0
        sorting: desc
        precision: 3
      - title: Test mean SMAPE %
