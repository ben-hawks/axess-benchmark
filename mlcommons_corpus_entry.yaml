  notes: |
    Formalized from the wa-hls4ml paper's dataset and models. The reference GNN and
    Transformer are retrained on post-synthesis resource labels (the paper's Table 4
    checkpoints were trained on HLS estimates); see the repo's docs/VALIDATION.md. A
    Codabench results-submission bundle is built from codabench/ in the repo.

