- date: "2026-05-27"            # publication of the benchmark paper (ACM TRETS 19(2))
  version: "v1.0"
  last_updated: "2026-10-02"
  expired: "no"
  valid: true                   # full runs verified 2026-10-02 (workstation CPU + NERSC Perlmutter)
  valid_date: "2026-10-02"

  name: "AXESS wa-hls4ml Benchmark"
  url: "https://github.com/ben-hawks/axess-benchmark"
  doi: "10.1145/3787490"        # the benchmark paper

  domain:
    - "Computational Science & AI"

  focus: "Predict the FPGA resources and latency of an hls4ml-converted neural network from the network and its hls4ml configuration, without running synthesis."

  keywords:
    - "FPGA"
    - "hls4ml"
    - "high-level synthesis"
    - "resource estimation"
    - "latency estimation"
    - "surrogate modeling"
    - "graph neural network"
    - "transformer"
    - "hardware-software codesign"

  summary: |
    hls4ml compiles neural networks into FPGA IP for latency- and power-constrained
    scientific edge systems such as LHC trigger systems. Getting a design's resource
    usage and latency from HLS and logic synthesis takes minutes to hours per design,
    which is too slow for codesign loops. The benchmark asks a surrogate model to predict,
    from a Keras/QKeras network (model_config) and its hls4ml configuration (hls_config),
    the post-logic-synthesis LUT, FF, DSP and BRAM counts and the HLS-estimated latency and
    initiation interval. It uses the 683,176-sample wa-hls4ml dataset (102,484-sample test
    split, 92,933 with ground truth) plus an 887-sample exemplar set of real scientific
    architectures that tests out-of-distribution generalization. Metrics are R^2, SMAPE and
    RMSE per target, overall and per network family. Three pretrained reference solutions
    (a rule4ml baseline MLP, and a GATv2 GNN and a Transformer retrained on post-synthesis
    labels) are scored by a scripted pipeline with Slurm workflows, which also produces
    upload-ready submissions for the benchmark's Codabench competition.

  licensing: "Apache-2.0 (code); CC-BY-NC-4.0 (dataset)"

  task_types:
    - "Regression"

  ai_capability_measured:
    - "Surrogate prediction of FPGA resource usage after logic synthesis"
    - "Surrogate prediction of hardware latency and initiation interval"
    - "Generalization to real scientific architectures outside the training distribution"

  metrics:
